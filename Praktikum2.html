
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 2 | MENAMPILKAN GAMBAR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 12px;
        }

        .grid-foto {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
        }

        .bingkai {
            border: 2px solid #ccc;
            padding: 3px;
            height: 190px;
            box-sizing: border-box;
            min-width: 0;
        }

        .bingkai img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .foto-kosong {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .foto-kosong a {
            font-size: 18px;
        }
    </style>
</head>

<body>

<h2>MENAMPILKAN GAMBAR</h2>

<div class="grid-foto">

    <div class="bingkai">
        <img src="mjl.jpg" alt="Foto 1">
    </div>

    <div class="bingkai">
        <img src="api.jpg" alt="Foto 2">
    </div>

    <div class="bingkai">
        <img src="malam.jpg" alt="Foto 3">
    </div>

    <div class="bingkai foto-kosong">
        <a href="foto.html">Foto 4</a>
    </div>

</div>

<p>
    <a href="index.html">kembali ke menu utama</a>
</p>

</body>
</html>
