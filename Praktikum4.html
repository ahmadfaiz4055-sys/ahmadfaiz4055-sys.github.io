<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

     <style>
     
        body {
            font-family: Arial, sans-serif;

            text-align: center;
            margin: 0;
        }
        header {
            background-color:#F0F0F0;
            color: #000104white;

        }

        video {

<body>

    <header>

        <p>Menonton Video Tanpa Internet</p>

    <h2>Danau vulcanic</h2>
    <a href="index.html">kembali ke menu utama </a>
    <video controls>
        <source src="Volcanic.mp4" type="video/mp4">
    </video>
    
    <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function() {
        navigator.serviceWorker.register(
            "./service-worker.js"
        ).catch(function(error) {
            console.log("Service Worker gagal:", error);
        });
    });
}
</script>

    
</body>
